version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      kotlin-and-test:
        patterns: ["org.jetbrains.kotlin*", "org.junit*", "io.mockk*", "org.mockito*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Kotlin moves workspace-wide as one coordinated change (compiler metadata is
      # forward-compatible by only one minor); per-repo offers fork the toolchain.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
