name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out FRC
        uses: actions/checkout@v4
        with:
          path: ARES-FRC

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned immutable ARES release is available
        working-directory: ARES-FRC
        shell: bash
        run: |
          version="$(sed -n 's/^aresVersion=//p' gradle.properties)"
          test -n "$version"
          curl --fail --silent --show-error --head \
            "https://raw.githubusercontent.com/ARES-23247/ARESLib-Kotlin/maven/org/aresfirst/ares/ares-bom/$version/ares-bom-$version.pom"

      - name: Verify generated project and run tests
        working-directory: ARES-FRC
        run: ./gradlew verifyAresProject test --no-daemon
