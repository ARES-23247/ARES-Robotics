org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Compose Desktop loads many screen classes lazily. Kotlin's incremental compiler has
# repeatedly left referenced synthetic/nested classes out of app/build/classes, causing
# delayed NoClassDefFoundError crashes only after a screen or gesture is opened. Compile
# complete module outputs; the build cache still avoids work when inputs are unchanged.
kotlin.incremental=false
