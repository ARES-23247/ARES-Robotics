name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  ARES_VERSION: 9.7.0

concurrency:
  group: analytics-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Analytics
        uses: actions/checkout@v4
        with:
          path: ARES-Analytics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-Analytics/app/src
              - ARES-Analytics/gateway/src
              - ARES-Analytics/shared/src

      - name: Verify immutable ARES release is available
        run: >-
          curl --fail --silent --show-error --head
          "https://raw.githubusercontent.com/ARES-23247/ARESLib-Kotlin/maven/org/aresfirst/ares/ares-bom/${ARES_VERSION}/ares-bom-${ARES_VERSION}.pom"

      - name: Compile Analytics sources
        working-directory: ARES-Analytics
        run: ./gradlew :shared:classes :app:classes :gateway:classes --refresh-dependencies --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
