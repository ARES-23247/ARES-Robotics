name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out FTC
        uses: actions/checkout@v4
        with:
          path: ARES-FTC

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned immutable ARES release is available
        working-directory: ARES-FTC
        shell: bash
        run: |
          version="$(sed -n 's/^aresVersion=//p' gradle.properties)"
          test -n "$version"
          curl --fail --silent --show-error --head \
            "https://raw.githubusercontent.com/ARES-23247/ARESLib-Kotlin/maven/org/aresfirst/ares/ares-bom/$version/ares-bom-$version.pom"

      - name: Verify generated project, test, and assemble
        working-directory: ARES-FTC
        run: >-
          ./gradlew
          :TeamCode:verifyAresProject
          :TeamCode:testDebugUnitTest
          :simulator:test
          :TeamCode:assembleDebug
          --no-daemon

      - name: Upload FTC APK
        uses: actions/upload-artifact@v4
        with:
          name: teamcode-debug-apk
          path: ARES-FTC/TeamCode/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  calibration-verification:
    name: Headless calibration verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out FTC
        uses: actions/checkout@v4
        with:
          path: ARES-FTC

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned immutable ARES release is available
        shell: pwsh
        working-directory: ARES-FTC
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^aresVersion=').Line.Split('=', 2)[1]
          Invoke-WebRequest -Method Head -Uri "https://raw.githubusercontent.com/ARES-23247/ARESLib-Kotlin/maven/org/aresfirst/ares/ares-bom/$version/ares-bom-$version.pom"

      - name: Run all calibration and SysId routines
        working-directory: ARES-FTC
        run: .\gradlew.bat :simulator:runCalibrationVerification --no-daemon
