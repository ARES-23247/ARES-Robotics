studioVersion=7.0.23
ftcStarterVersion=17.0.23
frcStarterVersion=17.0.23
xrpStarterVersion=3.0.22
lightbotExampleVersion=3.0.22
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
