studioVersion=7.0.4
ftcStarterVersion=17.0.3
frcStarterVersion=17.0.3
xrpStarterVersion=3.0.3
lightbotExampleVersion=3.0.3
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
