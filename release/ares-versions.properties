studioVersion=7.0.40
ftcStarterVersion=17.0.40
frcStarterVersion=17.0.40
xrpStarterVersion=3.0.39
lightbotExampleVersion=3.0.39
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
