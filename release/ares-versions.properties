studioVersion=7.0.2
ftcStarterVersion=17.0.1
frcStarterVersion=17.0.1
xrpStarterVersion=3.0.1
lightbotExampleVersion=3.0.1
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
