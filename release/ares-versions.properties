studioVersion=7.0.3
ftcStarterVersion=17.0.2
frcStarterVersion=17.0.2
xrpStarterVersion=3.0.2
lightbotExampleVersion=3.0.2
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
