# Canonical release identity for every isolated ARES build in this source monorepo.
# Validation candidates override aresVersion explicitly with -ParesVersion and an isolated
# -ParesRepository. Standalone project archives receive only the stable ARES dependency and
# repository coordinates so a Studio-only release cannot silently change their bytes.
aresVersion=16.0.0
studioVersion=6.0.0
ftcStarterVersion=16.0.0
frcStarterVersion=16.0.0
xrpStarterVersion=2.0.0
lightbotExampleVersion=2.0.0
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
