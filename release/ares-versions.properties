studioVersion=7.0.50
ftcStarterVersion=17.0.50
frcStarterVersion=17.0.50
xrpStarterVersion=3.0.49
lightbotExampleVersion=3.0.49
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
