studioVersion=7.0.42
ftcStarterVersion=17.0.42
frcStarterVersion=17.0.42
xrpStarterVersion=3.0.41
lightbotExampleVersion=3.0.41
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
