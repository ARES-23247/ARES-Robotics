studioVersion=7.0.0
ftcStarterVersion=17.0.0
frcStarterVersion=17.0.0
xrpStarterVersion=3.0.0
lightbotExampleVersion=3.0.0
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
