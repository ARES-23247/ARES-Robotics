studioVersion=7.0.9
ftcStarterVersion=17.0.8
frcStarterVersion=17.0.8
xrpStarterVersion=3.0.8
lightbotExampleVersion=3.0.8
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
