studioVersion=7.0.13
ftcStarterVersion=17.0.13
frcStarterVersion=17.0.13
xrpStarterVersion=3.0.12
lightbotExampleVersion=3.0.12
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
