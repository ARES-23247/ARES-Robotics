studioVersion=7.0.14
ftcStarterVersion=17.0.14
frcStarterVersion=17.0.14
xrpStarterVersion=3.0.13
lightbotExampleVersion=3.0.13
githubMavenRepository=https://raw.githubusercontent.com/ARES-23247/ARES-Robotics/maven
