name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frc-starter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned immutable ARES release is available
        shell: bash
        run: |
          version="$(sed -n 's/^aresVersion=//p' gradle.properties)"
          test -n "$version"
          curl --fail --silent --show-error --head \
            "https://raw.githubusercontent.com/ARES-23247/ARESLib-Kotlin/maven/org/aresfirst/ares/ares-bom/$version/ares-bom-$version.pom"

      - name: Generate, verify, test, and build
        run: >-
          ./gradlew generateAresProject verifyAresProject test build
          --refresh-dependencies --no-parallel --no-daemon --console=plain
