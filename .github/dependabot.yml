version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies]
    ignore:
      # Coroutines >=1.10 ships Kotlin 2.2 metadata unreadable by the 1.9 toolchain;
      # untrackable until the workspace-wide Kotlin 2.2 migration (see build pins).
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
        versions: ["[1.9.0,)"]
    groups:
      kotlin-and-gradle:
        patterns: ["org.jetbrains.kotlin*", "com.android.tools.build*", "com.gradle*"]
        update-types: [minor, patch]
      test-tooling:
        patterns: ["org.junit*", "io.mockk*", "org.mockito*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

