version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Scan every isolated Gradle root together, but group only by dependency identity.
  # This keeps Gson, LWJGL, and the Gradle wrapper synchronized across products and
  # generated starters without combining unrelated libraries into one review.
  # Major upgrades still require an explicit compatibility milestone and visible-app
  # or simulator validation.
  - package-ecosystem: gradle
    directories:
      - /ARESLib-Kotlin
      - /ARES-FTC
      - /ARES-FRC
      - /ARES-FTC-Starter
      - /ARES-FRC-Starter
      - /ARES-Analytics
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/New_York }
    open-pull-requests-limit: 8
    labels: [dependencies]
    groups:
      same-dependency-across-products:
        group-by: dependency-name
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
