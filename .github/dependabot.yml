version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Keep Gradle updates scoped to the product that owns the dependency. A single
  # multi-directory group produced misleading PR titles and mixed wrappers and
  # build plugins from otherwise independent FTC, FRC, Studio, and library builds.
  # Major upgrades require an explicit compatibility milestone and visible-app or
  # simulator validation; Dependabot continues to propose routine minor/patch work.
  - package-ecosystem: gradle
    directory: /ARESLib-Kotlin
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/New_York }
    open-pull-requests-limit: 4
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /ARES-FTC
    schedule: { interval: weekly, day: monday, time: "09:10", timezone: America/New_York }
    open-pull-requests-limit: 4
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /ARES-FRC
    schedule: { interval: weekly, day: monday, time: "09:20", timezone: America/New_York }
    open-pull-requests-limit: 4
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /ARES-FTC-Starter
    schedule: { interval: weekly, day: monday, time: "09:30", timezone: America/New_York }
    open-pull-requests-limit: 4
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /ARES-FRC-Starter
    schedule: { interval: weekly, day: monday, time: "09:40", timezone: America/New_York }
    open-pull-requests-limit: 4
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /ARES-Analytics
    schedule: { interval: weekly, day: monday, time: "09:50", timezone: America/New_York }
    open-pull-requests-limit: 4
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
