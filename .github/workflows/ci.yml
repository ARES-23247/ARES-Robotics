name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Reject tracked local artifacts
        shell: bash
        run: |
          tracked_artifacts="$(git ls-files -- local.properties '*.csv' 'scratch/**' '**/ares_run_summary.json' 'simulator/src/main/kotlin/com/areslib/sim/TestCrash.kt')"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Local-only artifacts are tracked:" >&2
            echo "$tracked_artifacts" >&2
            exit 1
          fi

      - name: Compile
        run: ./gradlew compileKotlin compileTestKotlin --console=plain

      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Select immutable validation candidate
        shell: bash
        run: |
          base_version="$(sed -n 's/^aresVersion=//p' gradle.properties)"
          echo "ARES_CANDIDATE_VERSION=${base_version}-rc.${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Check public API and publication bundle
        run: >-
          ./gradlew apiCheck publishReleaseValidation
          -ParesVersion=${ARES_CANDIDATE_VERSION}
          --no-parallel --console=plain
