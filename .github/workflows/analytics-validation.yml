name: Analytics Validation

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: smoke
        type: choice
        options: [smoke, soak]

permissions:
  contents: read

concurrency:
  group: analytics-validation-${{ github.ref }}-${{ inputs.profile || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-scopes.yml

  smoke:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' && github.event_name != 'schedule' && inputs.profile != 'soak'
    name: Dashboard smoke and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run dashboard smoke and baseline validation
        working-directory: ARES-Analytics
        run: >-
          ./gradlew :app:dashboardPerformanceBaseline
          -ParesUseSiblingLib=true
          --no-parallel --no-daemon --console=plain
      - name: Publish validation summary
        if: always()
        working-directory: ARES-Analytics
        run: test ! -f app/build/reports/dashboard-validation/dashboard-validation-smoke.md || cat app/build/reports/dashboard-validation/dashboard-validation-smoke.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboard-validation-smoke
          retention-days: 30
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/dashboard-validation/**
            ARES-Analytics/app/build/reports/tests/dashboardSmoke/**
            ARES-Analytics/app/build/test-results/dashboardSmoke/**

  soak:
    needs: changes
    if: github.event_name == 'schedule' || inputs.profile == 'soak'
    name: Dashboard 30-minute-equivalent soak
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run dashboard soak validation
        working-directory: ARES-Analytics
        run: >-
          ./gradlew :app:dashboardSoak
          -ParesUseSiblingLib=true
          --no-parallel --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboard-validation-soak
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/dashboard-validation/**
            ARES-Analytics/app/build/reports/tests/dashboardSoak/**
            ARES-Analytics/app/build/test-results/dashboardSoak/**

  result:
    name: Analytics validation result
    needs: [changes, smoke, soak]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check selected scope results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py
