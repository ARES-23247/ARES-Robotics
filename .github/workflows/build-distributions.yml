name: Build Desktop Packages

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      version:
        description: Application version to package (for example, 1.8.0)
        required: true
        type: string
      publish:
        description: Publish a GitHub release after every package and acceptance gate passes
        required: true
        default: false
        type: boolean
      windows_installer_trust:
        description: Require pinned Authenticode, or publish a disclosed GitHub-release SHA-256 bootstrap installer
        required: true
        default: checksum
        type: choice
        options:
          - checksum
          - authenticode

permissions:
  contents: read

env:
  ARES_VERSION: 13.0.0
  STUDIO_VERSION: 3.1.1
  FTC_STARTER_URL: https://github.com/ARES-23247/ARES-Robotics/releases/download/v3.1.1/ARES-FTC-Starter-13.0.0.zip
  FTC_STARTER_SHA256: 1b9ddf40e4a49d3fd2745c23f2075ef4e4312c0b8ffc5f6c32532c6b0a6d88ff
  FRC_STARTER_URL: https://github.com/ARES-23247/ARES-Robotics/releases/download/v3.1.1/ARES-FRC-Starter-13.0.0.zip
  FRC_STARTER_SHA256: 3922a72cccfbe7cc7cbba92489df2c0f5268026572d686a0c2752f865a4bf1be

concurrency:
  group: desktop-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Prepare package dependency candidate
    runs-on: ubuntu-latest
    outputs:
      ares-version: ${{ steps.identity.outputs.ares-version }}
      ares-candidate-version: ${{ steps.identity.outputs.ares-candidate-version }}
      studio-version: ${{ steps.identity.outputs.studio-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out published Maven branch
        uses: actions/checkout@v7
        with:
          ref: maven
          path: .published-maven
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve immutable package identities
        id: identity
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ares_base="$(sed -n 's/^aresVersion=//p' release/ares-versions.properties)"
          expected_ares_tree="$(tr -d '\r\n' < release/ares-source-tree.txt)"
          actual_ares_tree="$(git rev-parse HEAD:ARESLib-Kotlin)"
          if [[ ! "$expected_ares_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release/ares-source-tree.txt has no valid Git tree ID." >&2
            exit 1
          fi
          if [[ "$actual_ares_tree" != "$expected_ares_tree" ]]; then
            echo "ARESLib source changed without a new immutable release identity." >&2
            echo "Expected tree: $expected_ares_tree" >&2
            echo "Current tree:  $actual_ares_tree" >&2
            echo "Bump aresVersion and record the new ARESLib tree before packaging." >&2
            exit 1
          fi
          ares_candidate_version="${ares_base}-rc.${GITHUB_SHA::12}"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            studio_version="$REQUESTED_VERSION"
          else
            build=$((10#$RUN_NUMBER % 65535))
            studio_version="254.0.$build"
          fi
          if [[ ! "$studio_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid application version: $studio_version (expected MAJOR.MINOR.BUILD)" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          build=$((10#${BASH_REMATCH[3]}))
          if (( major > 255 || minor > 255 || build > 65535 )); then
            echo "Application version exceeds native package limits: $studio_version" >&2
            exit 1
          fi
          manifest_studio="$(sed -n 's/^studioVersion=//p' release/ares-versions.properties)"
          if [[ "$PUBLISH" == "true" && "$studio_version" != "$manifest_studio" ]]; then
            echo "Published Studio version must equal release/ares-versions.properties ($manifest_studio)." >&2
            exit 1
          fi
          echo "ares-version=$ares_base" >> "$GITHUB_OUTPUT"
          echo "ares-candidate-version=$ares_candidate_version" >> "$GITHUB_OUTPUT"
          echo "studio-version=$studio_version" >> "$GITHUB_OUTPUT"

      - name: Publish isolated ARES candidate
        working-directory: ARESLib-Kotlin
        run: >-
          ./gradlew apiCheck publishReleaseValidation
          -ParesVersion=${{ steps.identity.outputs.ares-candidate-version }}
          --no-parallel --no-daemon --console=plain

      - name: Stage exact final ARES repository
        working-directory: ARESLib-Kotlin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/github-repository
          mkdir -p build/github-repository
          git -C ../.published-maven archive HEAD | tar -x -C build/github-repository
          version="${{ steps.identity.outputs.ares-version }}"
          modules=(
            ares-bom codegen core frc-hardware frc-runtime ftc-hardware ftc-mocks
            project-compiler project-model project-schema simulation-foundation simulator
            simulator-runtime-linux simulator-runtime-macos simulator-runtime-windows telemetry-schema
          )
          published=0
          for module in "${modules[@]}"; do
            pom="build/github-repository/org/aresfirst/ares/$module/$version/$module-$version.pom"
            if [[ -f "$pom" ]]; then
              published=$((published + 1))
            fi
          done
          if (( published == ${#modules[@]} )); then
            echo "Reusing all ${#modules[@]} immutable ARES $version publications byte-for-byte."
          elif (( published != 0 )); then
            echo "ARES $version is only partially present on the Maven branch ($published/${#modules[@]} modules)." >&2
            echo "Refusing to rebuild or overwrite a partial immutable release." >&2
            exit 1
          else
            ./gradlew publishGitHubRepository \
              -ParesVersion="$version" \
              --no-parallel --no-daemon --console=plain
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package-validation-repository
          path: ARESLib-Kotlin/build/release-repository/
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: final-ares-repository
          path: ARESLib-Kotlin/build/github-repository/
          if-no-files-found: error
          retention-days: 3

  studio-verification:
    name: Verify all Studio suites, coverage, and maintainability gates
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: package-validation-repository
          path: .release-validation

      - name: Verify Gradle configuration does not mutate user settings
        shell: bash
        run: |
          isolated_home="$(mktemp -d)"
          ./ARESLib-Kotlin/gradlew -p ARESLib-Kotlin help "-Duser.home=$isolated_home" --no-daemon --console=plain
          ./ARES-Analytics/gradlew -p ARES-Analytics help "-Duser.home=$isolated_home" --no-daemon --console=plain
          ./ARES-FTC/gradlew -p ARES-FTC help "-Duser.home=$isolated_home" --no-daemon --console=plain
          ./ARES-FTC-Starter/gradlew -p ARES-FTC-Starter help "-Duser.home=$isolated_home" --no-daemon --console=plain
          if [[ -e "$isolated_home/.gradle/gradle.properties" ]]; then
            echo "Gradle configuration wrote user-level Gradle properties" >&2
            cat "$isolated_home/.gradle/gradle.properties" >&2
            exit 1
          fi

      - name: Resolve validation repository URI
        id: repository
        shell: pwsh
        run: |
          $uri = [Uri]::new((Resolve-Path '.release-validation').Path).AbsoluteUri
          "uri=$uri" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run the complete released Studio verification contract
        working-directory: ARES-Analytics
        run: >-
          ./gradlew studioReleaseVerification
          -ParesVersion=${{ needs.candidate.outputs.ares-candidate-version }}
          -ParesRepository=${{ steps.repository.outputs.uri }}
          --no-parallel --no-daemon --console=plain

      - name: Upload deterministic test, coverage, and dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-release-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/tests/test/**
            ARES-Analytics/shared/build/reports/tests/test/**
            ARES-Analytics/gateway/build/reports/tests/test/**
            ARES-Analytics/app/build/reports/kover/**
            ARES-Analytics/shared/build/reports/kover/**
            ARES-Analytics/gateway/build/reports/kover/**
            ARES-Analytics/app/build/reports/dashboard-validation/**

  zero-code-project-acceptance:
    name: Verify generated starter mirrors
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: package-validation-repository
          path: .release-validation

      - name: Export canonical mirrors and create reviewed archives
        shell: pwsh
        run: |
          $mirrors = Join-Path $env:RUNNER_TEMP 'ares-starter-mirrors'
          $archives = Join-Path $env:RUNNER_TEMP 'ares-official-templates'
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $mirrors
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $mirrors -Check
          Compress-Archive -Path "$mirrors\ARES-FTC-Starter\*" -DestinationPath "$archives\ftc.zip"
          Compress-Archive -Path "$mirrors\ARES-FRC-Starter\*" -DestinationPath "$archives\frc.zip"

      - name: Create, generate, test, simulate, and package fresh FTC and FRC projects
        shell: pwsh
        env:
          ARES_OFFICIAL_TEMPLATE_ARCHIVE_DIR: ${{ runner.temp }}\ares-official-templates
          ARES_OFFICIAL_TEMPLATE_OUTPUT_DIR: ${{ runner.temp }}\ares-zero-code-acceptance
          ARES_OFFICIAL_TEMPLATE_VALIDATION_REPOSITORY: ${{ github.workspace }}\.release-validation
          ARES_OFFICIAL_TEMPLATE_VALIDATION_VERSION: ${{ needs.candidate.outputs.ares-candidate-version }}
        run: >-
          .\ARES-Analytics\gradlew.bat -p ARES-Analytics :app:test
          --tests 'com.ares.analytics.service.project.OfficialProjectTemplateIntegrationTest'
          "-ParesVersion=${{ needs.candidate.outputs.ares-candidate-version }}"
          "-ParesRepository=file:///${{ github.workspace }}/.release-validation"
          --no-parallel --no-daemon --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zero-code-project-acceptance-logs
          path: ${{ runner.temp }}/ares-zero-code-acceptance/**/official-template-validation.log
          if-no-files-found: warn

  build-packages:
    name: Native package (${{ matrix.os }})
    needs: [candidate, studio-verification]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: ':app:packageReleaseMsi'
            artifact-path: 'ARES-Analytics/app/build/compose/binaries/main-release/msi/'
          - os: macos-latest
            task: ':app:packageReleaseDmg'
            artifact-path: 'ARES-Analytics/app/build/compose/binaries/main-release/dmg/'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: final-ares-repository
          path: .release-validation

      - name: Resolve validation repository URI
        id: repository
        shell: pwsh
        run: |
          $uri = [Uri]::new((Resolve-Path '.release-validation').Path).AbsoluteUri
          "uri=$uri" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and verify native package
        working-directory: ARES-Analytics
        shell: bash
        env:
          ARES_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.ARES_GOOGLE_OAUTH_CLIENT_ID }}
          ARES_GOOGLE_OAUTH_BROKER_URL: ${{ vars.ARES_GOOGLE_OAUTH_BROKER_URL }}
          ARES_GITHUB_APP_CLIENT_ID: ${{ vars.ARES_GITHUB_APP_CLIENT_ID }}
          ARES_GITHUB_APP_SLUG: ${{ vars.ARES_GITHUB_APP_SLUG }}
          ARES_WINDOWS_UPDATE_SIGNER_THUMBPRINTS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.windows_installer_trust == 'authenticode' && vars.ARES_WINDOWS_UPDATE_SIGNER_THUMBPRINTS || '' }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.task }} \
            -ParesAnalyticsVersion=${{ needs.candidate.outputs.studio-version }} \
            -ParesVersion=${{ needs.candidate.outputs.ares-version }} \
            -ParesRepository=${{ steps.repository.outputs.uri }} \
            --no-parallel --no-daemon --console=plain

      - name: Sign and verify Windows release installer
        if: >-
          runner.os == 'Windows' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          inputs.windows_installer_trust == 'authenticode'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          EXPECTED_SIGNER_THUMBPRINTS: ${{ vars.ARES_WINDOWS_UPDATE_SIGNER_THUMBPRINTS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'Protected Windows signing certificate secrets are required for a public release.'
          }
          $expectedThumbprints = @($env:EXPECTED_SIGNER_THUMBPRINTS -split ',' | ForEach-Object {
            ($_ -replace '[^A-Fa-f0-9]', '').ToUpperInvariant()
          } | Where-Object { $_ -match '^[A-F0-9]{40}$' })
          if ($expectedThumbprints.Count -eq 0) {
            throw 'ARES_WINDOWS_UPDATE_SIGNER_THUMBPRINTS must name at least one trusted SHA-1 certificate thumbprint.'
          }
          $installers = @(Get-ChildItem `
            -LiteralPath 'ARES-Analytics/app/build/compose/binaries/main-release/msi' `
            -Filter '*.msi')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI to sign, found $($installers.Count)."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "ares-windows-signing-$env:GITHUB_RUN_ID.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
            )
            $signTool = Get-ChildItem `
              -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter 'signtool.exe' `
              -File `
              -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw 'Windows SDK signtool.exe was not found.' }
            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr 'http://timestamp.digicert.com' `
              /f $certificatePath `
              /p $env:WINDOWS_SIGNING_PFX_PASSWORD `
              $installers[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
            & $signTool.FullName verify /pa /all /v $installers[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed with exit code $LASTEXITCODE." }
            $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
            if ($signature.Status -ne 'Valid' -or $actualThumbprint -notin $expectedThumbprints) {
              throw "Installer signer is not trusted by this release ($($signature.Status), $actualThumbprint)."
            }
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Record Windows installer trust evidence
        if: >-
          runner.os == 'Windows' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish
        shell: pwsh
        env:
          WINDOWS_INSTALLER_TRUST: ${{ inputs.windows_installer_trust }}
        run: |
          $installers = @(Get-ChildItem `
            -LiteralPath 'ARES-Analytics/app/build/compose/binaries/main-release/msi' `
            -Filter '*.msi')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI to describe, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          $thumbprint = if ($null -ne $signature.SignerCertificate) {
            $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
          } else { $null }
          if ($env:WINDOWS_INSTALLER_TRUST -eq 'authenticode' -and $signature.Status -ne 'Valid') {
            throw "Authenticode trust mode produced an invalid signature ($($signature.Status))."
          }
          $evidence = [ordered]@{
            schemaVersion = 1
            assetName = $installers[0].Name
            trustMode = $env:WINDOWS_INSTALLER_TRUST
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName).Hash.ToLowerInvariant()
            authenticodeStatus = $signature.Status.ToString()
            signerThumbprint = $thumbprint
          }
          $manifest = Join-Path $installers[0].DirectoryName 'windows-installer-trust.json'
          $evidence | ConvertTo-Json | Set-Content -LiteralPath $manifest -Encoding UTF8

      - uses: actions/upload-artifact@v7
        with:
          name: ARES-Robotics-Studio-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  starter-archives:
    name: Deterministic starter archives
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build immutable starter archives
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'starter-release-assets'
          .\scripts\build-starter-archives.ps1 -OutputDirectory $output
      - uses: actions/upload-artifact@v7
        with:
          name: starter-release-assets
          path: ${{ runner.temp }}/starter-release-assets/*.zip
          if-no-files-found: error
      - name: Verify immutable starter archive hashes
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'starter-release-assets'
          $expected = ConvertFrom-StringData (Get-Content -Raw release/starter-artifacts.properties)
          foreach ($league in @('FTC', 'FRC')) {
            $key = "${league}StarterSha256"
            $key = $key.Substring(0, 1).ToLowerInvariant() + $key.Substring(1)
            $versionKey = "${league}StarterVersion"
            $versionKey = $versionKey.Substring(0, 1).ToLowerInvariant() + $versionKey.Substring(1)
            $release = ConvertFrom-StringData (Get-Content -Raw release/ares-versions.properties)
            $archive = Join-Path $output "ARES-$league-Starter-$($release[$versionKey]).zip"
            $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$key]) { throw "$league starter archive hash changed: $actual" }
          }

  publish-release:
    name: Publish verified Studio release
    needs: [candidate, zero-code-project-acceptance, build-packages, starter-archives]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require protected main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Public releases may only be dispatched from the protected main branch.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: ARES-Robotics-Studio-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: starter-release-assets
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: final-ares-repository
          path: final-ares-repository

      - name: Publish immutable ARES Maven content first
        shell: pwsh
        run: >-
          .\scripts\publish-immutable-maven-repository.ps1
          -StagedRepository final-ares-repository
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -Push

      - name: Generate checksums
        shell: bash
        run: |
          find release-assets -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \) -print0 |
            while IFS= read -r -d '' asset; do sha256sum "$asset" > "$asset.sha256"; done

      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.candidate.outputs.studio-version }}
          name: ARES Robotics Studio ${{ needs.candidate.outputs.studio-version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Windows installer trust mode: `${{ inputs.windows_installer_trust }}`.

            `authenticode` releases require a valid certificate pinned into Studio. `checksum` releases are bootstrap packages: Studio verifies the exact MSI against the SHA-256 asset from this immutable GitHub release, but Windows will identify the publisher as unsigned. See `windows-installer-trust.json` for the machine-readable evidence.
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.sha256
            release-assets/**/windows-installer-trust.json
