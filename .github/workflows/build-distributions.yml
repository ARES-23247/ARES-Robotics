name: Build Desktop Packages

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARES_VERSION: 17.0.0
  STUDIO_VERSION: 7.0.0
  FTC_STARTER_URL: https://github.com/ARES-23247/ARES-Robotics/releases/download/v7.0.0/ARES-FTC-Starter-17.0.0.zip
  FTC_STARTER_SHA256: 578f863b3c66806d19fcf9540a1ea7661adf4f616fa2832e3dfbd936fbff3c06
  FRC_STARTER_URL: https://github.com/ARES-23247/ARES-Robotics/releases/download/v7.0.0/ARES-FRC-Starter-17.0.0.zip
  FRC_STARTER_SHA256: 9bc495e76e4369f2cd3ec783c5ec6a58109b360b6f8d2231f26a4581ac35a8a6
  XRP_STARTER_URL: https://github.com/ARES-23247/ARES-Robotics/releases/download/v7.0.0/ARES-XRP-Starter-3.0.0.zip
  XRP_STARTER_SHA256: 3d6435db4ba7052a401ef91d34e2491cd128952b6707de35ce223edf0abefab5
  LIGHTBOT_EXAMPLE_URL: https://github.com/ARES-23247/ARES-Robotics/releases/download/v7.0.0/ARES-Lightbot-Example-3.0.0.zip
  LIGHTBOT_EXAMPLE_SHA256: f8ac2ec284fc2a9e7952dceafa10f6387fc97d7f0818863f935162d5c42f434f

concurrency:
  group: desktop-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Prepare package dependency candidate
    runs-on: ubuntu-latest
    outputs:
      ares-version: ${{ steps.identity.outputs.ares-version }}
      ares-candidate-version: ${{ steps.identity.outputs.ares-candidate-version }}
      studio-version: ${{ steps.identity.outputs.studio-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out published Maven branch
        uses: actions/checkout@v7
        with:
          ref: maven
          path: .published-maven
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve immutable package identities
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ares_base="$(sed -n 's/^aresVersion=//p' release/ares-versions.properties)"
          expected_ares_tree="$(tr -d '\r\n' < release/ares-source-tree.txt)"
          actual_ares_tree="$(git rev-parse HEAD:ARESLib-Kotlin)"
          if [[ ! "$expected_ares_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release/ares-source-tree.txt has no valid Git tree ID." >&2
            exit 1
          fi
          if [[ "$actual_ares_tree" != "$expected_ares_tree" ]]; then
            echo "ARESLib source changed without a new immutable release identity." >&2
            echo "Expected tree: $expected_ares_tree" >&2
            echo "Current tree:  $actual_ares_tree" >&2
            echo "Bump aresVersion and record the new ARESLib tree before packaging." >&2
            exit 1
          fi
          ares_candidate_version="${ares_base}-rc.${GITHUB_SHA::12}"
          studio_version="$(sed -n 's/^studioVersion=//p' release/ares-versions.properties)"
          if [[ ! "$studio_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid application version: $studio_version (expected MAJOR.MINOR.BUILD)" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          build=$((10#${BASH_REMATCH[3]}))
          if (( major > 255 || minor > 255 || build > 65535 )); then
            echo "Application version exceeds native package limits: $studio_version" >&2
            exit 1
          fi
          echo "ares-version=$ares_base" >> "$GITHUB_OUTPUT"
          echo "ares-candidate-version=$ares_candidate_version" >> "$GITHUB_OUTPUT"
          echo "studio-version=$studio_version" >> "$GITHUB_OUTPUT"

      - name: Publish isolated ARES candidate
        working-directory: ARESLib-Kotlin
        run: >-
          ./gradlew apiCheck publishReleaseValidation
          -ParesVersion=${{ steps.identity.outputs.ares-candidate-version }}
          --no-parallel --no-daemon --console=plain

      - name: Stage exact final ARES repository
        working-directory: ARESLib-Kotlin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/github-repository
          mkdir -p build/github-repository
          git -C ../.published-maven archive HEAD | tar -x -C build/github-repository
          version="${{ steps.identity.outputs.ares-version }}"
          modules=(
            ares-bom codegen core frc-hardware frc-runtime ftc-hardware ftc-mocks
            project-compiler project-model project-schema simulation-foundation simulator
            simulator-runtime-linux simulator-runtime-macos simulator-runtime-windows telemetry-schema
            xrp-hardware
          )
          published=0
          for module in "${modules[@]}"; do
            pom="build/github-repository/org/aresfirst/ares/$module/$version/$module-$version.pom"
            if [[ -f "$pom" ]]; then
              published=$((published + 1))
            fi
          done
          if (( published == ${#modules[@]} )); then
            echo "Reusing all ${#modules[@]} immutable ARES $version publications byte-for-byte."
          elif (( published != 0 )); then
            echo "ARES $version is only partially present on the Maven branch ($published/${#modules[@]} modules)." >&2
            echo "Refusing to rebuild or overwrite a partial immutable release." >&2
            exit 1
          else
            ./gradlew publishGitHubRepository \
              -ParesVersion="$version" \
              --no-parallel --no-daemon --console=plain
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package-validation-repository
          path: ARESLib-Kotlin/build/release-repository/
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: final-ares-repository
          path: ARESLib-Kotlin/build/github-repository/
          if-no-files-found: error
          retention-days: 3

  studio-verification:
    name: Verify all Studio suites, coverage, and maintainability gates
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: package-validation-repository
          path: .release-validation

      - name: Verify Gradle configuration does not mutate user settings
        shell: bash
        run: |
          isolated_home="$(mktemp -d)"
          ./ARESLib-Kotlin/gradlew -p ARESLib-Kotlin help "-Duser.home=$isolated_home" --no-daemon --console=plain
          ./ARES-Analytics/gradlew -p ARES-Analytics help "-Duser.home=$isolated_home" --no-daemon --console=plain
          ./ARES-FTC/gradlew -p ARES-FTC help "-Duser.home=$isolated_home" --no-daemon --console=plain
          ./ARES-FTC-Starter/gradlew -p ARES-FTC-Starter help "-Duser.home=$isolated_home" --no-daemon --console=plain
          if [[ -e "$isolated_home/.gradle/gradle.properties" ]]; then
            echo "Gradle configuration wrote user-level Gradle properties" >&2
            cat "$isolated_home/.gradle/gradle.properties" >&2
            exit 1
          fi

      - name: Resolve validation repository URI
        id: repository
        shell: pwsh
        run: |
          $uri = [Uri]::new((Resolve-Path '.release-validation').Path).AbsoluteUri
          "uri=$uri" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run the complete released Studio verification contract
        working-directory: ARES-Analytics
        run: >-
          ./gradlew studioReleaseVerification
          -ParesVersion=${{ needs.candidate.outputs.ares-candidate-version }}
          -ParesRepository=${{ steps.repository.outputs.uri }}
          --no-parallel --no-daemon --console=plain

      - name: Upload deterministic test, coverage, and dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-release-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            ARES-Analytics/app/build/reports/tests/test/**
            ARES-Analytics/shared/build/reports/tests/test/**
            ARES-Analytics/gateway/build/reports/tests/test/**
            ARES-Analytics/app/build/reports/kover/**
            ARES-Analytics/shared/build/reports/kover/**
            ARES-Analytics/gateway/build/reports/kover/**
            ARES-Analytics/app/build/reports/dashboard-validation/**

  zero-code-project-acceptance:
    name: Verify generated starter mirrors
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: package-validation-repository
          path: .release-validation

      - name: Export canonical mirrors and create reviewed archives
        shell: pwsh
        run: |
          $mirrors = Join-Path $env:RUNNER_TEMP 'ares-starter-mirrors'
          $archives = Join-Path $env:RUNNER_TEMP 'ares-official-templates'
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $mirrors
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $mirrors -Check
          Compress-Archive -Path "$mirrors\ARES-FTC-Starter\*" -DestinationPath "$archives\ftc.zip"
          Compress-Archive -Path "$mirrors\ARES-FRC-Starter\*" -DestinationPath "$archives\frc.zip"
          Compress-Archive -Path "$mirrors\ARES-XRP-Starter\*" -DestinationPath "$archives\xrp.zip"

      - name: Create, generate, test, simulate, and package fresh FTC, FRC, and XRP projects
        shell: pwsh
        env:
          ARES_OFFICIAL_TEMPLATE_ARCHIVE_DIR: ${{ runner.temp }}\ares-official-templates
          ARES_OFFICIAL_TEMPLATE_OUTPUT_DIR: ${{ runner.temp }}\ares-zero-code-acceptance
          ARES_OFFICIAL_TEMPLATE_VALIDATION_REPOSITORY: ${{ github.workspace }}\.release-validation
          ARES_OFFICIAL_TEMPLATE_VALIDATION_VERSION: ${{ needs.candidate.outputs.ares-candidate-version }}
        run: >-
          .\ARES-Analytics\gradlew.bat -p ARES-Analytics :app:test
          --tests 'com.ares.analytics.service.project.OfficialProjectTemplateIntegrationTest'
          "-ParesVersion=${{ needs.candidate.outputs.ares-candidate-version }}"
          "-ParesRepository=file:///${{ github.workspace }}/.release-validation"
          --no-parallel --no-daemon --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zero-code-project-acceptance-logs
          path: ${{ runner.temp }}/ares-zero-code-acceptance/**/official-template-validation.log
          if-no-files-found: warn

  build-packages:
    name: Native package (${{ matrix.os }})
    needs: [candidate, studio-verification]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: ':app:packageReleaseMsi'
            artifact-path: 'ARES-Analytics/app/build/compose/binaries/main-release/msi/'
          - os: macos-latest
            task: ':app:packageReleaseDmg'
            artifact-path: 'ARES-Analytics/app/build/compose/binaries/main-release/dmg/'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: final-ares-repository
          path: .release-validation

      - name: Resolve validation repository URI
        id: repository
        shell: pwsh
        run: |
          $uri = [Uri]::new((Resolve-Path '.release-validation').Path).AbsoluteUri
          "uri=$uri" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and verify native package
        working-directory: ARES-Analytics
        shell: bash
        env:
          ARES_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.ARES_GOOGLE_OAUTH_CLIENT_ID }}
          ARES_GOOGLE_OAUTH_BROKER_URL: ${{ vars.ARES_GOOGLE_OAUTH_BROKER_URL }}
          ARES_GITHUB_APP_CLIENT_ID: ${{ vars.ARES_GITHUB_APP_CLIENT_ID }}
          ARES_GITHUB_APP_SLUG: ${{ vars.ARES_GITHUB_APP_SLUG }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.task }} \
            -ParesAnalyticsVersion=${{ needs.candidate.outputs.studio-version }} \
            -ParesVersion=${{ needs.candidate.outputs.ares-version }} \
            -ParesRepository=${{ steps.repository.outputs.uri }} \
            --no-parallel --no-daemon --console=plain

      - name: Record Windows installer trust evidence
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_INSTALLER_TRUST: checksum
        run: |
          $installers = @(Get-ChildItem `
            -LiteralPath 'ARES-Analytics/app/build/compose/binaries/main-release/msi' `
            -Filter '*.msi')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI to describe, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          $thumbprint = if ($null -ne $signature.SignerCertificate) {
            $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
          } else { $null }
          $evidence = [ordered]@{
            schemaVersion = 1
            assetName = $installers[0].Name
            trustMode = $env:WINDOWS_INSTALLER_TRUST
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName).Hash.ToLowerInvariant()
            authenticodeStatus = $signature.Status.ToString()
            signerThumbprint = $thumbprint
          }
          $manifest = Join-Path $installers[0].DirectoryName 'windows-installer-trust.json'
          $evidence | ConvertTo-Json | Set-Content -LiteralPath $manifest -Encoding UTF8

      - uses: actions/upload-artifact@v7
        with:
          name: ARES-Robotics-Studio-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  starter-archives:
    name: Deterministic project-template archives
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build immutable starter archives
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'starter-release-assets'
          .\scripts\build-starter-archives.ps1 -OutputDirectory $output
      - uses: actions/upload-artifact@v7
        with:
          name: project-template-release-assets
          path: ${{ runner.temp }}/starter-release-assets/*.zip
          if-no-files-found: error
      - name: Verify immutable starter archive hashes
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'starter-release-assets'
          $expected = ConvertFrom-StringData (Get-Content -Raw release/starter-artifacts.properties)
          $release = ConvertFrom-StringData (Get-Content -Raw release/ares-versions.properties)
          $templates = @(
            @{ Name = "ARES-FTC-Starter-$($release['ftcStarterVersion']).zip"; HashKey = 'ftcStarterSha256' },
            @{ Name = "ARES-FRC-Starter-$($release['frcStarterVersion']).zip"; HashKey = 'frcStarterSha256' },
            @{ Name = "ARES-XRP-Starter-$($release['xrpStarterVersion']).zip"; HashKey = 'xrpStarterSha256' },
            @{ Name = "ARES-Lightbot-Example-$($release['lightbotExampleVersion']).zip"; HashKey = 'lightbotExampleSha256' }
          )
          foreach ($template in $templates) {
            $archive = Join-Path $output $template.Name
            $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$template.HashKey]) { throw "$($template.Name) hash changed: $actual" }
          }

  seal-candidate:
    name: Seal attested release candidate
    needs: [candidate, studio-verification, zero-code-project-acceptance, build-packages, starter-archives]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: ARES-Robotics-Studio-*
          merge-multiple: true
          path: release-candidate/release-assets

      - uses: actions/download-artifact@v8
        with:
          name: project-template-release-assets
          path: release-candidate/release-assets

      - uses: actions/download-artifact@v8
        with:
          name: final-ares-repository
          path: release-candidate/final-ares-repository

      - name: Seal every promotable file to this exact Git tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_candidate.py seal \
            --root release-candidate \
            --manifest release-candidate/release-candidate.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --source-commit "$(git rev-parse HEAD)" \
            --event "$GITHUB_EVENT_NAME" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --ares-version "${{ needs.candidate.outputs.ares-version }}" \
            --studio-version "${{ needs.candidate.outputs.studio-version }}"
          python scripts/release_candidate.py verify \
            --root release-candidate \
            --manifest release-candidate/release-candidate.json \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-tree "$(git rev-parse 'HEAD^{tree}')" \
            --expected-event "$GITHUB_EVENT_NAME" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-ares-version "${{ needs.candidate.outputs.ares-version }}" \
            --expected-studio-version "${{ needs.candidate.outputs.studio-version }}" >/dev/null
          tar -czf "release-candidate-${GITHUB_RUN_ID}.tar.gz" -C release-candidate .

      - name: Attest the sealed candidate archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-candidate-${{ github.run_id }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release-candidate-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          retention-days: 30
