name: Verify autonomous contracts

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-autos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-scopes.yml

  verify:
    needs: changes
    if: needs.changes.outputs.autos == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out ARES-Robotics monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify autonomous contracts
        shell: powershell
        run: .\verify-autos.ps1

  result:
    name: Autonomous validation result
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check selected scope results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py
