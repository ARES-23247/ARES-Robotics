name: Verify autonomous contracts

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scopes.yml

  verify:
    needs: changes
    if: needs.changes.outputs.autos == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out ARES-Robotics monorepo
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify autonomous contracts
        shell: powershell
        run: .\verify-autos.ps1

  result:
    name: Autonomous validation result
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check selected scope results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py
