name: Verify autonomous contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "ARESLib-Kotlin/**"
      - "ARES-Analytics/**"
      - "ARES-FTC/**"
      - "ARES-FRC/**"
      - "verify-autos.ps1"
      - "verify-autos.sh"
      - ".github/workflows/verify-autos.yml"
  push:
    branches: [main]
    paths:
      - "ARESLib-Kotlin/**"
      - "ARES-Analytics/**"
      - "ARES-FTC/**"
      - "ARES-FRC/**"
      - "verify-autos.ps1"
      - "verify-autos.sh"
      - ".github/workflows/verify-autos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out ARES-Robotics monorepo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify autonomous contracts
        shell: powershell
        run: .\verify-autos.ps1
