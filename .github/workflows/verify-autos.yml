name: Verify autonomous contracts

on:
  push:
    branches: [main]
    paths:
      - "verify-autos.ps1"
      - "verify-autos.sh"
      - ".github/workflows/verify-autos.yml"
  workflow_dispatch:
    inputs:
      areslib_ref:
        description: ARESLib-Kotlin branch, tag, or commit
        required: true
        default: main
      analytics_ref:
        description: ARES-Analytics branch, tag, or commit
        required: true
        default: main
      ftc_ref:
        description: ARES-FTC branch, tag, or commit
        required: true
        default: main
      frc_ref:
        description: ARES-FRC branch, tag, or commit
        required: true
        default: main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out workspace automation
        uses: actions/checkout@v4

      - name: Check out ARESLib
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: ${{ inputs.areslib_ref || 'main' }}
          path: ARESLib-Kotlin
          token: ${{ secrets.ARES_REPOS_TOKEN || github.token }}

      - name: Check out Analytics
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARES-Analytics
          ref: ${{ inputs.analytics_ref || 'main' }}
          path: ARES-Analytics
          token: ${{ secrets.ARES_REPOS_TOKEN || github.token }}

      - name: Check out FTC
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARES-FTC
          ref: ${{ inputs.ftc_ref || 'main' }}
          path: ARES-FTC
          token: ${{ secrets.ARES_REPOS_TOKEN || github.token }}

      - name: Check out FRC
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARES-FRC
          ref: ${{ inputs.frc_ref || 'main' }}
          path: ARES-FRC
          token: ${{ secrets.ARES_REPOS_TOKEN || github.token }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify autonomous contracts
        shell: powershell
        run: .\verify-autos.ps1
