name: Stage Maven Central Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to stage (for example, 3.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  stage:
    name: Validate and stage ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify protected environment secrets
        shell: bash
        run: |
          for name in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required maven-central environment secret for ${name}." >&2
              exit 1
            fi
          done

      - name: Test API and signed publication bundle
        run: >-
          ./gradlew clean test apiCheck publishReleaseValidation
          -ParesVersion=${{ inputs.version }}
          --no-parallel --console=plain

      - name: Stage signed Maven Central deployment
        run: >-
          ./gradlew stageMavenCentral
          -ParesVersion=${{ inputs.version }}
          --no-parallel --console=plain

      - name: Next step
        run: >-
          echo "Deployment uploaded. Wait for the Maven Central Portal status to become
          Validated, review it, then click Publish. Central propagation normally takes
          additional time."
