name: Deploy Analytics Gateway

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: analytics-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy protected gateway
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gateway-production
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_GATEWAY_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy reviewed monorepo gateway
        working-directory: ARES-Analytics
        run: >-
          gcloud builds submit .
          --project=aresfirst-portal
          --config=gateway/cloudbuild.yaml
          --gcs-source-staging-dir=gs://aresfirst-portal_cloudbuild/source
          --service-account=projects/aresfirst-portal/serviceAccounts/analytics-cloudbuild-deployer@aresfirst-portal.iam.gserviceaccount.com
          --substitutions=COMMIT_SHA=${GITHUB_SHA}
      - name: Verify deployed health endpoint
        run: |
          service_url="$(gcloud run services describe ares-analytics-gateway --project=aresfirst-portal --region=us-central1 --format='value(status.url)')"
          test -n "$service_url"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$service_url/healthz"
