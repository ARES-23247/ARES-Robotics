name: Monorepo CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-scopes.yml

  policy:
    name: Source and release policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify monorepo ownership and dependency policy
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          .\scripts\verify-imported-histories.ps1
          .\scripts\verify-doc-links.ps1
          .\scripts\verify-monorepo-policy.ps1

      - name: Prove starter mirrors are deterministic
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ares-starter-mirrors'
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $output
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $output -Check

  candidate:
    name: ARESLib candidate
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Select immutable validation identity
        id: identity
        shell: bash
        run: |
          base="$(sed -n 's/^aresVersion=//p' release/ares-versions.properties)"
          version="${base}-rc.${GITHUB_SHA::12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test API and publish isolated candidate
        working-directory: ARESLib-Kotlin
        run: >-
          ./gradlew test apiCheck publishReleaseValidation
          -ParesVersion=${{ steps.identity.outputs.version }}
          --no-parallel --no-daemon --console=plain

      - name: Retain robot-readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-readiness-evidence
          path: |
            ARESLib-Kotlin/codegen/build/reports/robot-readiness/*.json
            ARESLib-Kotlin/codegen/build/test-results/test/TEST-*Readiness*.xml
            ARESLib-Kotlin/core/build/test-results/test/TEST-*Readiness*.xml
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test robot log dashboard in Chromium
        shell: bash
        run: |
          browser_tools="$RUNNER_TEMP/ares-log-browser"
          npm install --prefix "$browser_tools" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$browser_tools/node_modules" node --test scripts/test_log_manager_dashboard.cjs

      - uses: actions/upload-artifact@v7
        with:
          name: ares-validation-repository
          path: ARESLib-Kotlin/build/release-repository/
          if-no-files-found: error
          retention-days: 3

  ftc:
    name: FTC robot and simulator
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.ftc == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FTC project, simulator, and APK
        working-directory: ARES-FTC
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew :TeamCode:testDebugUnitTest :simulator:test :TeamCode:assembleDebug \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain
      - name: Export BioBuzz from the canonical starter and season overlay
        shell: pwsh
        run: ./scripts/export-starter-mirrors.ps1 -OutputRoot "$env:RUNNER_TEMP/biobuzz-consumer"
      - name: Test generated BioBuzz robot, field simulation, and APK
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          cd "$RUNNER_TEMP/biobuzz-consumer/ARES-BIOBUZZ-Example"
          bash ./gradlew generateAresProject :TeamCode:verifyAresProject \
            :TeamCode:testDebugUnitTest :simulator:test :TeamCode:assembleDebug \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: biobuzz-consumer-evidence
          path: |
            ${{ runner.temp }}/biobuzz-consumer/ARES-BIOBUZZ-Example/TeamCode/build/test-results/**
            ${{ runner.temp }}/biobuzz-consumer/ARES-BIOBUZZ-Example/simulator/build/test-results/**
            ${{ runner.temp }}/biobuzz-consumer/ARES-BIOBUZZ-Example/TeamCode/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: lightbot-debug-apk
          path: ARES-FTC/TeamCode/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  frc:
    name: FRC robot and simulation contracts
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.frc == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FRC project and league simulator contracts
        working-directory: ARES-FRC
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew test "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

  ftc-starter:
    name: FTC starter mirror source
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.ftc_starter == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FTC starter, simulator, and APK
        working-directory: ARES-FTC-Starter
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew :TeamCode:testDebugUnitTest :simulator:test :TeamCode:assembleDebug \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

  frc-starter:
    name: FRC starter mirror source
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.frc_starter == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FRC starter and simulation contracts
        working-directory: ARES-FRC-Starter
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew test "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

  xrp-starter:
    name: XRP MicroPython starter
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.xrp_starter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile DSL to Python and run standalone safety tests
        working-directory: ARES-XRP-Starter
        shell: bash
        run: |
          chmod +x ares
          ./ares generate
          ./ares verify
      - name: Test the reusable MicroPython runtime
        working-directory: ARESLib-Kotlin/ares-micro
        run: python -m unittest discover -s tests -v
      - name: Retain XRP host readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xrp-host-readiness-evidence
          path: ARES-XRP-Starter/build/reports/robot-readiness/*.json
          if-no-files-found: warn
          retention-days: 14

  analytics:
    name: Studio, gateway, and analytics
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.analytics == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test Studio, shared models, and gateway
        working-directory: ARES-Analytics
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
          TEST_APP: ${{ needs.changes.outputs.analytics_app }}
          TEST_SHARED: ${{ needs.changes.outputs.analytics_shared }}
          TEST_GATEWAY: ${{ needs.changes.outputs.analytics_gateway }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          test_tasks=()
          if [[ "$TEST_SHARED" == "true" ]]; then test_tasks+=(:shared:test); fi
          if [[ "$TEST_APP" == "true" ]]; then test_tasks+=(:app:test :app:consumerRoundtripTest); fi
          if [[ "$TEST_GATEWAY" == "true" ]]; then test_tasks+=(:gateway:test); fi
          if (( ${#test_tasks[@]} == 0 )); then echo "No selected Studio test tasks" >&2; exit 1; fi
          ./gradlew "${test_tasks[@]}" \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

      - name: Retain consumer round-trip evidence
        if: always() && needs.changes.outputs.analytics_app == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: studio-consumer-roundtrip-evidence
          path: |
            ARES-Analytics/app/build/test-results/consumerRoundtripTest
            ARES-Analytics/app/build/consumer-roundtrip-evidence
          if-no-files-found: warn
          retention-days: 14

  result:
    name: Monorepo CI result
    needs: [changes, policy, candidate, ftc, frc, ftc-starter, frc-starter, xrp-starter, analytics]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check selected scope results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py
