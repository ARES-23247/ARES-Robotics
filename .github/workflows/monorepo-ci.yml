name: Monorepo CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify affected products
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      lib: ${{ steps.classify.outputs.lib }}
      ftc: ${{ steps.classify.outputs.ftc }}
      frc: ${{ steps.classify.outputs.frc }}
      ftc_starter: ${{ steps.classify.outputs.ftc_starter }}
      frc_starter: ${{ steps.classify.outputs.frc_starter }}
      analytics: ${{ steps.classify.outputs.analytics }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/classify_ci_paths.py
          --event-name "${{ github.event_name }}"
          --base-sha "$BASE_SHA"
          --head-sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

  policy:
    name: Source and release policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify monorepo ownership and dependency policy
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          .\scripts\verify-imported-histories.ps1
          .\scripts\verify-doc-links.ps1
          .\scripts\verify-monorepo-policy.ps1

      - name: Prove starter mirrors are deterministic
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ares-starter-mirrors'
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $output
          .\scripts\export-starter-mirrors.ps1 -OutputRoot $output -Check

  candidate:
    name: ARESLib candidate
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Select immutable validation identity
        id: identity
        shell: bash
        run: |
          base="$(sed -n 's/^aresVersion=//p' release/ares-versions.properties)"
          version="${base}-rc.${GITHUB_SHA::12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test API and publish isolated candidate
        working-directory: ARESLib-Kotlin
        run: >-
          ./gradlew test apiCheck publishReleaseValidation
          -ParesVersion=${{ steps.identity.outputs.version }}
          --no-parallel --no-daemon --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: ares-validation-repository
          path: ARESLib-Kotlin/build/release-repository/
          if-no-files-found: error
          retention-days: 3

  ftc:
    name: FTC robot and simulator
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.ftc == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FTC project, simulator, and APK
        working-directory: ARES-FTC
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew :TeamCode:testDebugUnitTest :simulator:test :TeamCode:assembleDebug \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: lightbot-debug-apk
          path: ARES-FTC/TeamCode/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  frc:
    name: FRC robot and simulation contracts
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.frc == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FRC project and league simulator contracts
        working-directory: ARES-FRC
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew test "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

  ftc-starter:
    name: FTC starter mirror source
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.ftc_starter == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FTC starter, simulator, and APK
        working-directory: ARES-FTC-Starter
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew :TeamCode:testDebugUnitTest :simulator:test :TeamCode:assembleDebug \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

  frc-starter:
    name: FRC starter mirror source
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.frc_starter == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test generated FRC starter and simulation contracts
        working-directory: ARES-FRC-Starter
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew test "${dependency_args[@]}" --no-parallel --no-daemon --console=plain

  analytics:
    name: Studio, gateway, and analytics
    needs: [changes, candidate]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.analytics == 'true') &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        if: needs.candidate.result == 'success'
        with:
          name: ares-validation-repository
          path: .release-validation
      - name: Test Studio, shared models, and gateway
        working-directory: ARES-Analytics
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          dependency_args=()
          if [[ "$CANDIDATE_RESULT" == "success" ]]; then
            dependency_args+=("-ParesVersion=$CANDIDATE_VERSION")
            dependency_args+=("-ParesRepository=file://${GITHUB_WORKSPACE}/.release-validation")
          fi
          ./gradlew :shared:test :app:test :gateway:test \
            "${dependency_args[@]}" --no-parallel --no-daemon --console=plain
